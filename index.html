<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app-logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Resolved by the inline script below so it tracks the theme the user actually
         chose, not the OS preference. A media-scoped pair would disagree with an in-app
         override; ThemeProvider keeps this in sync on every toggle. -->
    <meta name="theme-color" content="#08080b" />
    <!-- Apply the stored theme BEFORE first paint.
         ThemeProvider sets `.dark` in a useEffect, so it only lands once the bundle has
         downloaded, parsed and mounted. Until then `:root` resolves to light
         (--canvas #f3f3f6) and every dark-mode user saw a white flash on each cold start
         of the installed PWA. This mirrors getInitialTheme() in src/lib/theme.tsx exactly,
         and the effect then writes the same value, so the two cannot disagree.
         The try/catch is load-bearing: localStorage throws in some private-browsing modes
         and an uncaught throw in a blocking head script would stop the page dead. -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem('classpoint-theme')
          var d =
            s === 'dark' ||
            (s !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (d) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = d ? 'dark' : 'light'
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', d ? '#08080b' : '#f3f3f6')
        } catch (e) {}
      })()
    </script>
    <!-- Capture the install prompt as early as possible: the browser can fire
         beforeinstallprompt before the app bundle mounts its React listener, and
         the event is never re-fired. Stash it for PwaInstallProvider to read. -->
    <script>
      window.__cpInstall = { event: null, installed: false }
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault()
        window.__cpInstall.event = e
        window.dispatchEvent(new Event('cp:installable'))
      })
      window.addEventListener('appinstalled', function () {
        window.__cpInstall.installed = true
        window.__cpInstall.event = null
      })
    </script>
    <meta name="description" content="ClassPoint — earn points, level up, climb the leaderboard." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>ClassPoint</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
